# the residue test on both profiles.
#
# Resource hygiene inventory (planned steps):
#   install    — npm ci: runs and exits; no daemon. Rebuilds node_modules — full-only (slow;
#                the fast profile uses the node_modules already installed).
#   format     — prettier --check: one-shot, no data.
#   lint       — eslint: one-shot, no daemon (no eslint_d), no data.
#   typecheck  — tsc -b --noEmit… : one-shot (no --watch, no tsserver), no data.
#   test       — vitest run (never bare `vitest`: watch mode never exits); unit tests use an
#                in-memory fake repo, so no DB is written and no server is started.
#   audit      — npm audit: one network call, exits; full-only (needs the network).
#
# Prerequisites (uncomment with their steps):
