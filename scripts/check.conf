# scripts/check.conf — the steps behind ./scripts/check (generated at bootstrap, 2026-11-14).
# Format: <name>: <command> — runs in order, fails fast. [fast] in the NAME = in the fast profile.
# Every step must leave nothing running and no data for the next run (docs/testing.md, Resource hygiene).
